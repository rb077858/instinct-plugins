<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; connect-src https://ntfy.sh; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4f46e5">
<title>Responses</title>
<style>
:root{--ink:#14172b;--mute:#667085;--line:#e6e8f4;--bg:#f2f3fa;--brand:#4f46e5;--brand2:#7c3aed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{background:linear-gradient(150deg,#4338ca,var(--brand) 45%,var(--brand2));color:#fff;padding:20px 16px 64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(620px 220px at 88% -60px,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.wrap{max-width:720px;margin:0 auto;position:relative;z-index:1}
.badge{font-size:12px;letter-spacing:.03em;opacity:.85;margin-bottom:12px}
h1{margin:0 0 10px;font-size:28px;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
#count{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 12px;font-size:13px;margin:0}
main{max-width:720px;margin:-40px auto 0;padding:0 14px 44px;position:relative;z-index:1}
.card{background:#fff;border-radius:20px;padding:20px;margin:0 0 14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.07);border:1px solid rgba(228,231,242,.8)}
.tabs{display:flex;gap:4px;background:#e7e9f6;padding:4px;border-radius:14px;margin:0 0 16px}
.tab{flex:1;border:0;border-radius:11px;padding:10px 8px;font:600 14px inherit;background:transparent;color:var(--mute);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.q{font-weight:650;margin:0 0 4px;overflow-wrap:anywhere;font-size:16px}
.bar{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}
.bar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2));min-width:3px;transition:width .4s ease}
.bar .l{flex:0 0 38%;overflow-wrap:anywhere}.bar .t{flex:1}.bar .n{flex:none;color:var(--mute);width:28px;text-align:right;font-weight:600}
.ans{background:#f6f7fe;border:1px solid #eceefb;border-radius:10px;padding:9px 12px;margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.meta{color:var(--mute);font-size:13px;margin:0 0 10px}
.k{color:var(--mute);font-size:12.5px;margin:12px 0 3px;font-weight:600;letter-spacing:.02em}
button.act{border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;font:600 15px inherit;background:#fff;color:var(--ink);cursor:pointer;transition:border-color .15s,color .15s}
button.act:hover{border-color:var(--brand);color:var(--brand)}
.empty{text-align:center;color:var(--mute);padding:30px}
.hide{display:none}
.rankrow{padding:12px 0;border-bottom:1px solid var(--line)}
.rankrow:last-child{border-bottom:0}
.ranktop{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.rankbadge{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-content:center;font:700 13px/1 system-ui;background:#eef0f8;color:var(--mute)}
.rankbadge.first{background:#fef3c7;color:#92400e}
.rankbadge.second{background:#e5e7eb;color:#4b5563}
.rankbadge.third{background:#ffedd5;color:#9a3412}
.rankname{flex:1;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.scoreval{flex:none;font-weight:700;font-size:14px;color:var(--brand)}
.scorebar{height:8px;border-radius:6px;background:#eef0f8;overflow:hidden;margin:0 0 4px 38px}
.scorebar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.pend{color:var(--mute);font-size:12px;margin-left:38px}
</style>
</head>
<body>
<div class="hero"><div class="wrap"><div class="badge">Created by Instinct via instinct-plugins</div><h1 id="title">Responses</h1><div id="count" class="badge"></div></div></div>
<main>
<div class="tabs"><button class="tab on" id="t1">Summary</button><button class="tab" id="t2">Each response</button></div>
<div id="v1"></div><div id="v2" class="hide"></div>
<div class="card"><button class="act" id="csv">Download CSV</button><p class="meta" style="margin:10px 0 0">Responses are decrypted in this browser with the key in the link. Keep this link private. The relay keeps messages for about 12 hours, so save the CSV if you need a copy.</p></div>
</main>
<script>
"use strict";
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pipe(bytes,stream){var r=new Blob([bytes]).stream().pipeThrough(stream);return new Uint8Array(await new Response(r).arrayBuffer())}
function h(t,a){var e=document.createElement(t);if(a)for(var k in a){if(k==="class")e.className=a[k];else e.setAttribute(k,a[k])}for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c)}return e}
var P={};(location.hash||"").replace(/^#/,"").split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0)P[kv.slice(0,i)]=kv.slice(i+1)});
var spec=null,rows=[],quizKey=null;
function gradeLocal(key,answers){
  var score=0,max=0,pending=[];
  Object.keys(key).forEach(function(qid){
    var e=key[qid];max+=e.p;
    if(e.c===undefined){pending.push(qid);return}
    var a=answers[qid];
    if(Array.isArray(e.c)){
      var sel=Array.isArray(a)?a:[];
      if(e.part){
        var right=sel.filter(function(x){return e.c.indexOf(x)>=0}).length;
        var wrong=sel.filter(function(x){return e.c.indexOf(x)<0}).length;
        score+=Math.max(0,right-wrong)/e.c.length*e.p;
      }else if(sel.length===e.c.length&&sel.every(function(x){return e.c.indexOf(x)>=0}))score+=e.p;
    }else if(typeof a==="string"&&a===e.c)score+=e.p;
  });
  return{score:Math.round(score*100)/100,max:max,pending:pending};
}
function msg(t){document.getElementById("v1").appendChild(h("div",{"class":"card empty"},t))}
async function decrypt(jwk,text){
  var m=JSON.parse(text);
  var priv=await crypto.subtle.importKey("jwk",jwk,{name:"ECDH",namedCurve:"P-256"},false,["deriveKey"]);
  var pub=await crypto.subtle.importKey("raw",b64uToBytes(m.e),{name:"ECDH",namedCurve:"P-256"},false,[]);
  var key=await crypto.subtle.deriveKey({name:"ECDH",public:pub},priv,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64uToBytes(m.n)},key,b64uToBytes(m.c)));
  return JSON.parse(new TextDecoder().decode(await pipe(pt,new DecompressionStream("deflate-raw"))));
}
function fmt(v){return Array.isArray(v)?v.join(", "):String(v==null?"":v)}
async function main(){
  if(!P.t||!P.k||!P.d){msg("This responses link is incomplete.");return}
  var jwk=JSON.parse(new TextDecoder().decode(b64uToBytes(P.k)));
  spec=JSON.parse(new TextDecoder().decode(await pipe(b64uToBytes(P.d),new DecompressionStream("deflate-raw"))));
  if(P.qk){try{quizKey=JSON.parse(new TextDecoder().decode(await pipe(b64uToBytes(P.qk),new DecompressionStream("deflate-raw"))))}catch(e){quizKey=null}}
  if(quizKey){
    var tabs=document.querySelector(".tabs");
    var t3=h("button",{"class":"tab",id:"t3"},"Scores");tabs.appendChild(t3);
    var v3=h("div",{"class":"hide",id:"v3"});document.querySelector("main").insertBefore(v3,document.querySelector("main .card"));
    t3.onclick=function(){tab(3)};
  }
  document.getElementById("title").textContent=spec.title||"Responses";
  var r=await fetch("https://ntfy.sh/"+encodeURIComponent(P.t)+"/json?poll=1&since=all");
  if(!r.ok)throw new Error("Could not load responses (error "+r.status+").");
  var lines=(await r.text()).split("\n").filter(Boolean);
  for(var i=0;i<lines.length;i++){var m=JSON.parse(lines[i]);if(m.event!=="message")continue;try{var p=await decrypt(jwk,m.message);if(p.f===spec.fid)rows.push({time:m.time*1000,a:p.a||{},via:p.via})}catch(e){}}
  rows.sort(function(a,b){return a.time-b.time});
  document.getElementById("count").textContent=rows.length+" response"+(rows.length===1?"":"s")+" still on the relay";
  draw();
}
function draw(){
  var v1=document.getElementById("v1"),v2=document.getElementById("v2");v1.textContent="";v2.textContent="";
  if(!rows.length){v1.appendChild(h("div",{"class":"card empty"},"No responses yet."));return}
  spec.questions.forEach(function(q){
    if(q.type==="info")return;
    var card=h("div",{"class":"card"},h("p",{"class":"q"},q.text));
    var vals=rows.map(function(r){return r.a[q.id]}).filter(function(v){return v!=null&&v!==""&&!(Array.isArray(v)&&!v.length)});
    if(["single","multi","dropdown","scale","rating","yesno"].indexOf(q.type)>=0){
      var cnt={},order=[];
      if(q.options)q.options.forEach(function(o){var l=typeof o==="string"?o:o.label;cnt[l]=0;order.push(l)});
      vals.forEach(function(v){(Array.isArray(v)?v:[v]).forEach(function(x){x=String(x);if(!(x in cnt)){cnt[x]=0;order.push(x)}cnt[x]++})});
      if(!q.options)order.sort();
      var mx=Math.max.apply(null,order.map(function(k){return cnt[k]}).concat([1]));
      order.forEach(function(k){var i=h("i");i.style.width="0%";card.appendChild(h("div",{"class":"bar"},h("span",{"class":"l"},k),h("span",{"class":"t"},i),h("span",{"class":"n"},String(cnt[k]))));setTimeout(function(){i.style.width=(cnt[k]/mx*100)+"%"},30)});
    }else{
      if(!vals.length)card.appendChild(h("p",{"class":"meta"},"No answers."));
      else card.appendChild(h("p",{"class":"meta"},vals.length+" answer"+(vals.length===1?"":"s")+" below."));
      vals.forEach(function(v){card.appendChild(h("div",{"class":"ans"},fmt(v)))});
    }
    v1.appendChild(card);
  });
  rows.forEach(function(r,i){
    var head="#"+(i+1)+" \u00b7 "+new Date(r.time).toLocaleString();
    if(quizKey){var g0=gradeLocal(quizKey,r.a);head+=" \u00b7 auto score "+g0.score+"/"+g0.max+(g0.pending.length?" (+"+g0.pending.length+" to grade)":"")}
    var card=h("div",{"class":"card"},h("p",{"class":"meta"},head));
    spec.questions.forEach(function(q){if(q.type==="info")return;var v=r.a[q.id];card.appendChild(h("p",{"class":"k"},q.text));card.appendChild(h("div",{"class":"ans"},fmt(v)||"-"))});
    v2.appendChild(card);
  });
  if(quizKey){
    var v3=document.getElementById("v3");v3.textContent="";
    var sc=rows.map(function(r,i){return{i:i,r:r,g:gradeLocal(quizKey,r.a)}}).sort(function(a,b){return b.g.score-a.g.score});
    var card3=h("div",{"class":"card"},h("p",{"class":"q"},"Ranking (auto-graded)"));
    sc.forEach(function(x,rank){
      var bc=rank===0?"first":rank===1?"second":rank===2?"third":"";
      var frac=x.g.max?Math.min(1,x.g.score/x.g.max):0;
      card3.appendChild(h("div",{"class":"rankrow"},
        h("div",{"class":"ranktop"},
          h("span",{"class":"rankbadge "+bc},String(rank+1)),
          h("span",{"class":"rankname"},"Response #"+(x.i+1)),
          h("span",{"class":"scoreval"},x.g.score+"/"+x.g.max)),
        h("div",{"class":"scorebar"},h("i",{style:"width:"+(frac*100)+"%"})),
        h("div",{"class":"pend"},new Date(x.r.time).toLocaleString()+(x.g.pending.length?" \u00b7 "+x.g.pending.length+" open question(s) still to grade":""))));
    });
    card3.appendChild(h("p",{"class":"meta"},"Manual points for open questions are added by the assistant and are not shown here."));
    v3.appendChild(card3);
  }
}
function csvCell(s){s=String(s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
document.getElementById("csv").addEventListener("click",function(){
  if(!spec)return;var qs=spec.questions.filter(function(q){return q.type!=="info"});
  var out=[["Time"].concat(qs.map(function(q){return q.text}))];
  rows.forEach(function(r){out.push([new Date(r.time).toISOString()].concat(qs.map(function(q){return fmt(r.a[q.id])})))});
  var blob=new Blob([out.map(function(l){return l.map(csvCell).join(",")}).join("\n")],{type:"text/csv"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="responses.csv";a.click();
});
function tab(n){[1,2,3].forEach(function(i){var v=document.getElementById("v"+i),t=document.getElementById("t"+i);if(v)v.classList.toggle("hide",n!==i);if(t)t.classList.toggle("on",n===i)})}
document.getElementById("t1").onclick=function(){tab(1)};document.getElementById("t2").onclick=function(){tab(2)};
main().catch(function(e){document.getElementById("v1").textContent="";msg(e.message||"Something went wrong.")});
</script>
</body>
</html>
